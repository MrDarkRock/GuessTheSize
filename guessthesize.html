<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Size Clash</title>
<meta name="description" content="Multiplayer-Schätzspiel im Browser: Wie groß ist das wirklich? Bis zu 8 Spieler live.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📏</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0b0d1f;
  --bg2: #12153a;
  --card: rgba(255, 255, 255, 0.06);
  --card-b: rgba(255, 255, 255, 0.11);
  --text: #f3f4ff;
  --muted: #a3a8d6;
  --acc1: #ff4f8b;
  --acc2: #ffb23f;
  --acc3: #3fd6ff;
  --good: #5ef0a0;
  --bad: #ff6b6b;
  --grad: linear-gradient(100deg, var(--acc1), var(--acc2));
  --r: 18px;
  --head: 'Bricolage Grotesque', 'Segoe UI', system-ui, sans-serif;
  --body: 'Inter', 'Segoe UI', system-ui, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--body);
  font-size: 16px;
  line-height: 1.45;
  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
}
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
[hidden] { display: none !important; }

/* Hintergrund */
.bg { position: fixed; inset: 0; z-index: -1; overflow: hidden; background: radial-gradient(1200px 700px at 50% -10%, var(--bg2), var(--bg)); }
.bg i { position: absolute; width: 46vmax; height: 46vmax; border-radius: 50%; filter: blur(90px); opacity: .28; animation: drift 26s ease-in-out infinite alternate; }
.bg i:nth-child(1) { background: var(--acc1); left: -12vmax; top: -10vmax; }
.bg i:nth-child(2) { background: var(--acc3); right: -16vmax; top: 18vh; animation-duration: 32s; opacity: .18; }
.bg i:nth-child(3) { background: #7a4dff; left: 25vw; bottom: -26vmax; animation-duration: 38s; }
@keyframes drift { to { transform: translate(6vmax, 4vmax) scale(1.12); } }

/* Kopfzeile */
.topbar { display: flex; align-items: center; justify-content: space-between; padding: 14px 24px; max-width: 1240px; margin: 0 auto; }
.logo { background: none; border: 0; display: flex; align-items: center; gap: 10px; font-family: var(--head); font-weight: 800; font-size: 22px; letter-spacing: .02em; padding: 0; }
.logo b { background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent; }
.logo .mark { font-size: 24px; transform: rotate(-20deg); }
.top-right { display: flex; gap: 10px; align-items: center; }
.chip { background: var(--card); border: 1px solid var(--card-b); border-radius: 999px; padding: 7px 14px; font-weight: 600; font-size: 14px; color: var(--muted); }
.chip em { font-style: normal; }
.chip b { color: var(--text); letter-spacing: .14em; margin-left: 4px; }
.chip:hover { border-color: rgba(255, 255, 255, .3); }
.iconbtn { width: 40px; height: 40px; border-radius: 12px; border: 1px solid var(--card-b); background: var(--card); font-size: 18px; }
.iconbtn:hover { background: rgba(255, 255, 255, .12); }

main { max-width: 1240px; margin: 0 auto; padding: 8px 24px 110px; }
.screen { animation: fadein .35s ease; }
.screen.noanim, .pslot.seen { animation: none; }
@keyframes fadein { from { opacity: 0; transform: translateY(8px); } }

.card { background: var(--card); border: 1px solid var(--card-b); border-radius: var(--r); padding: 22px; backdrop-filter: blur(12px); }
.card h3 { margin: 0 0 14px; font-family: var(--head); font-size: 20px; }
.card-head { display: flex; justify-content: space-between; align-items: baseline; }
.count { color: var(--muted); font-weight: 600; font-size: 14px; }
.kicker { text-transform: uppercase; letter-spacing: .16em; font-size: 12px; font-weight: 700; color: var(--muted); }
.hint { color: var(--muted); font-size: 14px; }

/* Buttons */
.btn { border: 1px solid var(--card-b); background: rgba(255, 255, 255, .08); border-radius: 14px; padding: 11px 18px; font-weight: 700; transition: transform .12s, background .2s, box-shadow .2s; white-space: nowrap; }
.btn:hover:not(:disabled) { background: rgba(255, 255, 255, .14); transform: translateY(-1px); }
.btn:active:not(:disabled) { transform: translateY(1px); }
.btn:disabled { opacity: .45; cursor: default; }
.btn.primary { background: var(--grad); border-color: transparent; color: #1a0b16; box-shadow: 0 8px 30px -8px rgba(255, 79, 139, .7); }
.btn.primary:hover:not(:disabled) { background: var(--grad); box-shadow: 0 12px 36px -8px rgba(255, 79, 139, .9); }
.btn.big { padding: 14px 26px; font-size: 18px; }
.btn.huge { padding: 18px 44px; font-size: 22px; border-radius: 18px; font-family: var(--head); }
.btn.wide { width: 100%; }
kbd { font-family: var(--body); font-size: 11px; padding: 2px 6px; border-radius: 6px; background: rgba(0, 0, 0, .18); margin-left: 6px; vertical-align: 2px; }

input, select { background: rgba(0, 0, 0, .28); border: 1px solid var(--card-b); border-radius: 12px; padding: 12px 14px; outline: none; transition: border-color .2s, box-shadow .2s; }
input:focus, select:focus { border-color: var(--acc3); box-shadow: 0 0 0 3px rgba(63, 214, 255, .2); }
select option { background: var(--bg2); }
.shake { animation: shake .4s; border-color: var(--bad) !important; }
@keyframes shake { 20%, 60% { transform: translateX(-6px); } 40%, 80% { transform: translateX(6px); } }

/* Startseite */
.home { display: flex; flex-direction: column; align-items: center; gap: 28px; padding-top: 3vh; }
.hero { text-align: center; }
.logo-big { font-family: var(--head); font-weight: 800; font-size: clamp(56px, 11vw, 128px); line-height: .9; letter-spacing: -.02em; display: flex; justify-content: center; gap: .18em; }
.logo-big .l1 { color: var(--text); }
.logo-big .l2 { background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent; display: inline-block; transform-origin: left bottom; animation: grow 3.2s ease-in-out infinite; }
@keyframes grow { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.08, 1.12); } }
.tagline { color: var(--muted); font-size: 18px; max-width: 620px; margin: 18px auto 0; }
.tagline b { color: var(--text); }
.home-card { width: min(760px, 100%); min-width: 0; display: flex; flex-direction: column; gap: 20px; }
.field label { display: block; font-weight: 700; font-size: 13px; text-transform: uppercase; letter-spacing: .12em; color: var(--muted); margin-bottom: 8px; }
.field input { width: 100%; font-size: 18px; }
.avatars { display: grid; grid-template-columns: repeat(8, 1fr); gap: 8px; }
.av { aspect-ratio: 1; padding: 0; min-width: 0; font-size: 26px; border-radius: 14px; border: 2px solid transparent; background: rgba(255, 255, 255, .06); transition: transform .15s; }
.av:hover { transform: scale(1.08); }
.av.sel { border-color: var(--acc2); background: rgba(255, 178, 63, .16); transform: scale(1.08); }
.split { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.pane { min-width: 0; border: 1px solid var(--card-b); border-radius: 16px; padding: 18px; display: flex; flex-direction: column; gap: 10px; }
.pane.hl { border-color: rgba(255, 178, 63, .55); background: rgba(255, 178, 63, .06); }
.pane h3 { margin: 0; font-family: var(--head); }
.pane p { margin: 0; color: var(--muted); font-size: 14px; flex: 1; }
.joinrow { display: flex; gap: 8px; margin-top: auto; }
.code-input { flex: 1; width: 0; min-width: 0; text-transform: uppercase; letter-spacing: .3em; font-weight: 800; font-size: 22px; text-align: center; font-family: var(--head); }
.how { display: flex; gap: 18px; flex-wrap: wrap; justify-content: center; color: var(--muted); font-size: 14px; }
.how div { display: flex; align-items: center; gap: 8px; }
.how span { width: 24px; height: 24px; display: grid; place-items: center; border-radius: 50%; background: var(--card); border: 1px solid var(--card-b); font-weight: 700; color: var(--text); font-size: 12px; }

/* Lobby */
.lobby-grid { display: grid; grid-template-columns: 1fr 1.4fr; gap: 18px; }
.invite { text-align: center; display: flex; flex-direction: column; justify-content: center; gap: 10px; }
.bigcode { font-family: var(--head); font-weight: 800; font-size: clamp(54px, 8vw, 88px); letter-spacing: .14em; background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent; line-height: 1.05; }
.invite-actions { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
.pgrid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
.pslot { position: relative; border-radius: 16px; padding: 14px 8px; text-align: center; background: color-mix(in srgb, var(--pc) 14%, transparent); border: 1px solid color-mix(in srgb, var(--pc) 50%, transparent); animation: popin .35s cubic-bezier(.3, 1.6, .5, 1); }
.pslot.empty { background: none; border: 1px dashed var(--card-b); opacity: .55; animation: none; }
.pav { font-size: 34px; line-height: 1.1; }
.pname { font-weight: 700; font-size: 14px; margin-top: 4px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pname em { color: var(--muted); font-style: normal; font-weight: 500; }
.badge { position: absolute; top: -8px; left: 50%; transform: translateX(-50%); background: var(--acc2); color: #241400; font-size: 10px; font-weight: 800; padding: 2px 8px; border-radius: 99px; letter-spacing: .1em; }
.kick { position: absolute; top: 4px; right: 4px; width: 22px; height: 22px; border-radius: 50%; border: 0; background: rgba(0, 0, 0, .3); font-size: 11px; opacity: 0; transition: opacity .2s; }
.pslot:hover .kick { opacity: 1; }
@keyframes popin { from { transform: scale(.6); opacity: 0; } }
.setting { margin-bottom: 16px; }
.slabel { font-size: 13px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .1em; margin-bottom: 8px; }
.seg { display: inline-flex; background: rgba(0, 0, 0, .25); border-radius: 12px; padding: 4px; gap: 4px; }
.seg button { border: 0; background: none; padding: 8px 16px; border-radius: 9px; font-weight: 700; color: var(--muted); }
.seg button.on { background: var(--text); color: var(--bg); }
.seg button:disabled { cursor: default; }
.cats { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
.cats button { text-align: left; border: 1px solid var(--card-b); background: rgba(0, 0, 0, .18); border-radius: 12px; padding: 10px 12px; font-weight: 700; font-size: 14px; display: flex; flex-direction: column; gap: 2px; }
.cats button span { font-size: 20px; }
.cats button small { color: var(--muted); font-weight: 500; font-size: 12px; }
.cats button.on { border-color: var(--acc2); background: rgba(255, 178, 63, .12); }
.cats button:disabled { cursor: default; }
.rules ul { margin: 0; padding-left: 18px; color: var(--muted); display: flex; flex-direction: column; gap: 8px; font-size: 15px; }
.rules b { color: var(--text); }
.lobby-cta { display: flex; flex-direction: column; align-items: center; gap: 10px; margin-top: 26px; }
.waiting { color: var(--muted); font-weight: 600; display: flex; align-items: center; gap: 12px; font-size: 18px; }
.dots { display: inline-flex; gap: 5px; }
.dots i { width: 8px; height: 8px; border-radius: 50%; background: var(--acc2); animation: bounce 1.2s infinite; }
.dots i:nth-child(2) { animation-delay: .15s; } .dots i:nth-child(3) { animation-delay: .3s; }
@keyframes bounce { 0%, 80%, 100% { transform: translateY(0); opacity: .4; } 40% { transform: translateY(-7px); opacity: 1; } }

/* Spielbildschirm */
.game, .reveal { display: flex; flex-direction: column; gap: 16px; max-width: 980px; margin: 0 auto; }
.gamebar { display: flex; align-items: center; gap: 10px; }
.pill { background: var(--card); border: 1px solid var(--card-b); border-radius: 999px; padding: 8px 16px; font-weight: 600; color: var(--muted); font-size: 14px; }
.pill b { color: var(--text); }
.qmini { flex: 1; color: var(--muted); font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.timer { margin-left: auto; position: relative; width: 58px; height: 58px; display: grid; place-items: center; }
.timer svg { position: absolute; inset: 0; transform: rotate(-90deg); }
.timer circle { fill: none; stroke-width: 4; }
.timer .trk { stroke: rgba(255, 255, 255, .1); }
.timer .bar { stroke: var(--acc3); stroke-linecap: round; transition: stroke-dashoffset .15s linear, stroke .3s; }
.timer span { font-family: var(--head); font-weight: 800; font-size: 20px; }
.timer.urgent .bar { stroke: var(--bad); }
.timer.urgent span { color: var(--bad); animation: pulse .5s infinite alternate; }
@keyframes pulse { to { transform: scale(1.25); } }

.qcard { display: flex; align-items: center; gap: 28px; padding: 26px 30px; border-radius: 24px; background: linear-gradient(135deg, rgba(255, 79, 139, .16), rgba(63, 214, 255, .1)); border: 1px solid var(--card-b); animation: popin .5s cubic-bezier(.3, 1.4, .5, 1); }
.qemoji { font-size: clamp(72px, 11vw, 120px); line-height: 1; filter: drop-shadow(0 12px 24px rgba(0, 0, 0, .4)); animation: float 3s ease-in-out infinite; }
@keyframes float { 50% { transform: translateY(-8px) rotate(3deg); } }
.qname { font-weight: 700; color: var(--acc2); text-transform: uppercase; letter-spacing: .12em; font-size: 14px; }
.qtext h2 { font-family: var(--head); font-size: clamp(24px, 3.4vw, 38px); line-height: 1.12; margin: 6px 0 0; }

.guess { display: flex; flex-direction: column; gap: 18px; transition: border-color .3s, box-shadow .3s; }
.guess.joker-on { border-color: var(--acc2); box-shadow: 0 0 0 3px rgba(255, 178, 63, .25), 0 0 40px -10px rgba(255, 178, 63, .6); }
.readout { text-align: center; }
.rval { font-family: var(--head); font-weight: 800; font-size: clamp(48px, 7vw, 76px); line-height: 1; display: flex; justify-content: center; align-items: baseline; gap: 12px; }
.rval #rUnit { font-size: .5em; color: var(--acc2); }
.rcmp { color: var(--muted); font-weight: 600; margin-top: 6px; min-height: 1.4em; }
.slider-wrap { padding: 0 6px 26px; position: relative; }
input[type=range] { -webkit-appearance: none; appearance: none; width: 100%; height: 14px; border-radius: 99px; padding: 0; border: 0; background: linear-gradient(90deg, #3fd6ff, #7a4dff, #ff4f8b, #ffb23f); box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .15); cursor: pointer; }
input[type=range]:focus { box-shadow: 0 0 0 3px rgba(63, 214, 255, .25); }
input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 34px; height: 34px; border-radius: 50%; background: #fff; border: 5px solid var(--bg); box-shadow: 0 0 0 3px #fff, 0 6px 18px rgba(0, 0, 0, .5); cursor: grab; }
input[type=range]::-moz-range-thumb { width: 26px; height: 26px; border-radius: 50%; background: #fff; border: 5px solid var(--bg); box-shadow: 0 0 0 3px #fff, 0 6px 18px rgba(0, 0, 0, .5); cursor: grab; }
input[type=range]:disabled { filter: grayscale(.7); opacity: .6; cursor: default; }
.ticks { position: absolute; left: 6px; right: 6px; top: 22px; height: 16px; }
.ticks span { position: absolute; transform: translateX(-50%); font-size: 12px; color: var(--muted); white-space: nowrap; }
.ticks span::before { content: ''; position: absolute; left: 50%; top: -8px; width: 1px; height: 6px; background: rgba(255, 255, 255, .3); }
.ticks span:first-child { transform: none; } .ticks span:last-child { transform: translateX(-100%); }
.controls { display: flex; gap: 10px; align-items: stretch; flex-wrap: wrap; }
.exact { display: flex; gap: 6px; flex: 1; min-width: 220px; }
.exact input { flex: 1; min-width: 0; font-size: 18px; font-weight: 700; }
.exact select { width: 82px; font-weight: 700; }
.joker.on { background: rgba(255, 178, 63, .2); border-color: var(--acc2); color: var(--acc2); }
.lockbtn { padding: 12px 26px; font-size: 17px; }
.lockedmsg { text-align: center; font-weight: 600; color: var(--good); background: rgba(94, 240, 160, .08); border-radius: 12px; padding: 12px; }
.guess.locked .readout { opacity: .7; }
.lockstrip { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
.lchip { display: flex; align-items: center; gap: 6px; padding: 6px 12px 6px 8px; border-radius: 999px; background: var(--card); border: 1px solid var(--card-b); font-weight: 600; font-size: 14px; color: var(--muted); transition: all .3s; }
.lchip span { font-size: 18px; }
.lchip i { font-style: normal; font-weight: 800; }
.lchip.done { color: var(--text); background: color-mix(in srgb, var(--pc) 22%, transparent); border-color: var(--pc); animation: popin .3s; }
.lchip.done i { color: var(--good); }
.intro { position: fixed; inset: 0; display: grid; place-items: center; background: rgba(8, 9, 24, .78); backdrop-filter: blur(6px); z-index: 30; animation: introOut 1.8s forwards; pointer-events: none; }
.intro div { text-align: center; animation: introIn 1.8s forwards; }
.intro small { display: block; font-family: var(--head); font-weight: 800; font-size: 40px; letter-spacing: .04em; }
.intro b { font-size: 120px; display: block; }
@keyframes introOut { 0%, 75% { opacity: 1; } 100% { opacity: 0; } }
@keyframes introIn { 0% { transform: scale(.4); opacity: 0; } 25% { transform: scale(1.06); opacity: 1; } 75% { transform: scale(1); } 100% { transform: scale(1.6); opacity: 0; } }

/* Auflösung */
.answer { display: flex; align-items: center; gap: 24px; background: linear-gradient(135deg, rgba(94, 240, 160, .14), rgba(63, 214, 255, .08)); border-color: rgba(94, 240, 160, .35); }
.aemoji { font-size: 84px; line-height: 1; }
.abig { font-family: var(--head); font-weight: 800; font-size: clamp(44px, 6.5vw, 72px); line-height: 1.05; }
.abig.done { animation: stamp .4s cubic-bezier(.3, 1.8, .5, 1); color: var(--good); }
@keyframes stamp { from { transform: scale(1.3); } }
.acmp { color: var(--muted); font-weight: 600; }
.ruler-card { padding: 22px 34px 16px; }
.ruler { position: relative; height: 190px; }
.ruler .line { position: absolute; left: 0; right: 0; bottom: 56px; height: 6px; border-radius: 99px; background: linear-gradient(90deg, #3fd6ff, #7a4dff, #ff4f8b, #ffb23f); opacity: .55; }
.gm { position: absolute; bottom: calc(66px + var(--lane) * 38px); transform: translateX(-50%); animation: dropin .5s backwards cubic-bezier(.3, 1.5, .5, 1); z-index: 2; }
.gm span { display: grid; place-items: center; width: 36px; height: 36px; border-radius: 50%; background: color-mix(in srgb, var(--pc) 35%, var(--bg)); border: 2px solid var(--pc); font-size: 20px; }
.gm::after { content: ''; position: absolute; left: 50%; top: 100%; width: 2px; height: calc(var(--lane) * 38px + 10px); background: var(--pc); opacity: .6; transform: translateX(-50%); }
@keyframes dropin { from { transform: translate(-50%, -40px); opacity: 0; } }
.am { position: absolute; bottom: 30px; transform: translateX(-50%); z-index: 3; animation: dropin .6s 1.1s backwards cubic-bezier(.3, 1.5, .5, 1); }
.am::before { content: ''; position: absolute; left: 50%; bottom: 100%; width: 4px; height: 160px; transform: translateX(-50%); background: linear-gradient(to top, var(--good), transparent); }
.flag { background: var(--good); color: #062417; font-weight: 800; padding: 3px 10px; border-radius: 8px; white-space: nowrap; font-size: 14px; }
.rticks { position: absolute; left: 0; right: 0; bottom: 0; height: 18px; }
.rticks span { position: absolute; transform: translateX(-50%); font-size: 12px; color: var(--muted); white-space: nowrap; }
.results { padding: 10px 14px; }
.rrow { display: grid; grid-template-columns: 34px 42px 1fr 170px 76px 96px; align-items: center; gap: 10px; padding: 10px 8px; border-radius: 12px; animation: fadein .4s backwards; }
.rrow + .rrow { border-top: 1px solid rgba(255, 255, 255, .06); }
.rrow.head { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .1em; font-weight: 700; animation: none; }
.rrow.me { background: rgba(255, 255, 255, .05); box-shadow: inset 3px 0 0 var(--pc); }
.rk { font-weight: 800; color: var(--muted); text-align: center; }
.ra { font-size: 26px; text-align: center; }
.rn b { display: block; }
.tags { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 2px; }
.tag { font-size: 11px; font-weight: 700; padding: 2px 7px; border-radius: 99px; background: rgba(255, 255, 255, .08); }
.tag.hit { background: rgba(94, 240, 160, .18); color: var(--good); }
.tag.crown { background: rgba(255, 178, 63, .2); color: var(--acc2); }
.tag.jw { background: rgba(255, 178, 63, .3); color: #ffd28a; }
.tag.jl { background: rgba(255, 107, 107, .2); color: var(--bad); }
.rg { font-weight: 700; text-align: right; }
.rg small { display: block; color: var(--muted); font-weight: 500; font-size: 12px; }
.rp { font-family: var(--head); font-weight: 800; color: var(--good); text-align: right; font-size: 18px; }
.rt { font-weight: 800; text-align: right; font-size: 18px; }
.rrow.head .rp, .rrow.head .rt { font-size: 12px; color: var(--muted); font-family: var(--body); }
.rt i { font-style: normal; font-size: 11px; margin-left: 4px; vertical-align: 2px; }
.rt i.up { color: var(--good); } .rt i.down { color: var(--bad); }
.fact { background: rgba(255, 178, 63, .08); border: 1px solid rgba(255, 178, 63, .25); border-radius: 14px; padding: 14px 18px; color: #ffe2b0; }
.reveal-foot { display: flex; align-items: center; justify-content: center; gap: 16px; min-height: 56px; }

/* Endstand */
.final { max-width: 980px; margin: 0 auto; }
.final-title { font-family: var(--head); text-align: center; font-size: clamp(34px, 5vw, 56px); margin: 10px 0 20px; }
.podium { display: grid; grid-template-columns: 1fr 1.15fr 1fr; align-items: end; gap: 14px; max-width: 640px; margin: 0 auto 26px; }
.pod { text-align: center; animation: rise .8s backwards cubic-bezier(.3, 1.3, .5, 1); }
.pod.p1 { animation-delay: .9s; } .pod.p2 { animation-delay: .5s; } .pod.p3 { animation-delay: .2s; }
@keyframes rise { from { transform: translateY(60px); opacity: 0; } }
.pod .pav { font-size: 52px; }
.pod.p1 .pav { font-size: 72px; }
.pod.p1 .pav::before { content: '👑'; display: block; font-size: 34px; margin-bottom: -8px; animation: float 2s ease-in-out infinite; }
.pod .pscore { font-family: var(--head); font-weight: 800; font-size: 22px; color: var(--pc); }
.pod .block { margin-top: 8px; border-radius: 14px 14px 0 0; background: linear-gradient(to bottom, color-mix(in srgb, var(--pc) 55%, transparent), color-mix(in srgb, var(--pc) 10%, transparent)); font-family: var(--head); font-weight: 800; font-size: 40px; display: grid; place-items: center; }
.pod.p1 .block { height: 150px; } .pod.p2 .block { height: 110px; } .pod.p3 .block { height: 80px; }
.final-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.frow { display: flex; align-items: center; gap: 10px; padding: 10px 6px; border-bottom: 1px solid rgba(255, 255, 255, .06); font-size: 17px; }
.frow.me { background: rgba(255, 255, 255, .05); border-radius: 10px; }
.frow .rk { width: 26px; }
.frow b { flex: 1; color: var(--pc); }
.frow .fx { color: var(--muted); font-size: 13px; }
.frow .fs { font-family: var(--head); font-weight: 800; font-size: 20px; min-width: 64px; text-align: right; }
.award { display: flex; gap: 14px; align-items: center; padding: 10px 0; }
.award + .award { border-top: 1px solid rgba(255, 255, 255, .06); }
.aicon { font-size: 34px; }
.atitle { font-weight: 800; color: var(--acc2); text-transform: uppercase; font-size: 12px; letter-spacing: .12em; }

/* Reaktionen, Toasts, Overlays */
.reactbar { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); display: flex; gap: 4px; padding: 6px; border-radius: 999px; background: rgba(18, 21, 58, .85); border: 1px solid var(--card-b); backdrop-filter: blur(12px); z-index: 20; }
.reactbar button { width: 44px; height: 44px; border: 0; background: none; font-size: 24px; border-radius: 50%; transition: transform .15s, background .15s; }
.reactbar button:hover { background: rgba(255, 255, 255, .1); transform: scale(1.2) translateY(-3px); }
.floater { position: fixed; bottom: 70px; z-index: 40; pointer-events: none; display: flex; flex-direction: column; align-items: center; animation: floatup 2.6s ease-out forwards; }
.floater b { font-size: 46px; }
.floater small { font-size: 12px; font-weight: 700; padding: 1px 8px; border-radius: 99px; color: #10112a; }
@keyframes floatup { 0% { transform: translateY(0) scale(.4); opacity: 0; } 12% { transform: translateY(-30px) scale(1.15); opacity: 1; } 100% { transform: translateY(-46vh) scale(1); opacity: 0; } }
#toasts { position: fixed; top: 74px; right: 20px; display: flex; flex-direction: column; gap: 8px; z-index: 60; }
.toast { background: rgba(18, 21, 58, .95); border: 1px solid var(--card-b); padding: 10px 16px; border-radius: 12px; font-weight: 600; font-size: 14px; animation: slidein .3s; transition: opacity .4s, transform .4s; box-shadow: 0 10px 30px rgba(0, 0, 0, .4); }
.toast.out { opacity: 0; transform: translateX(30px); }
@keyframes slidein { from { transform: translateX(40px); opacity: 0; } }
.overlay { position: fixed; inset: 0; display: grid; place-items: center; background: rgba(6, 7, 20, .7); backdrop-filter: blur(4px); z-index: 70; padding: 16px; }
.modal { max-width: 440px; width: 100%; background: #171a44; text-align: center; animation: popin .3s; }
.modal p { color: var(--muted); }
.mbtns { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
.busy { display: flex; flex-direction: column; align-items: center; gap: 6px; }
.spinner { width: 44px; height: 44px; border-radius: 50%; border: 4px solid rgba(255, 255, 255, .15); border-top-color: var(--acc2); animation: spin .8s linear infinite; margin-top: 6px; }
@keyframes spin { to { transform: rotate(360deg); } }
#confetti { position: fixed; inset: 0; pointer-events: none; z-index: 50; }

/* Schmale Bildschirme */
@media (max-width: 860px) {
  .lobby-grid, .final-grid, .split { grid-template-columns: 1fr; }
  .pgrid { grid-template-columns: repeat(4, 1fr); }
  .rrow { grid-template-columns: 24px 32px 1fr 110px 56px; }
  .rrow .rt { display: none; }
}
@media (max-width: 560px) {
  .topbar, main { padding-left: 16px; padding-right: 16px; }
  .avatars { grid-template-columns: repeat(8, 1fr); gap: 4px; }
  .av { font-size: 20px; border-radius: 10px; }
  .pgrid { grid-template-columns: repeat(2, 1fr); }
  .qcard { flex-direction: column; text-align: center; gap: 10px; padding: 20px; }
  .answer { flex-direction: column; text-align: center; }
  .pill.cat { display: none; }
  .reactbar button { width: 36px; height: 36px; font-size: 20px; }
  .ticks span:nth-child(even) { display: none; }
  .chip { padding: 7px 10px; white-space: nowrap; }
  .chip span, .chip em { display: none; }
  .logo { font-size: 18px; }
  .controls .lockbtn { flex: 1; }
  .podium { gap: 8px; }
  .pod .pav { font-size: 40px; } .pod.p1 .pav { font-size: 54px; }
  .rrow { grid-template-columns: 26px 1fr 90px 50px; }
  .rrow .ra { display: none; }
  .ruler-card { padding: 18px 22px 12px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition: none !important; }
}

/* Größenvergleich */
.modes { grid-template-columns: repeat(3, 1fr); }
.qcard.slim { padding: 16px 24px; }
.qcard.slim h2 { font-size: clamp(20px, 2.6vw, 30px); }
.t-red { color: #ff7a8c; }
.t-blue { color: #7fa9ff; }
.stage {
  position: relative; height: 340px; border-radius: 14px; overflow: hidden; touch-action: none; cursor: ns-resize; user-select: none;
  background:
    repeating-linear-gradient(0deg, transparent 0 39px, rgba(255, 255, 255, .045) 39px 40px),
    repeating-linear-gradient(90deg, transparent 0 39px, rgba(255, 255, 255, .045) 39px 40px),
    linear-gradient(180deg, rgba(20, 22, 60, .6), rgba(80, 30, 90, .35));
}
.stage-card { padding: 12px; }
.stage-card .stage { cursor: default; }
.ground { position: absolute; left: 0; right: 0; bottom: 0; height: 18px; background: rgba(255, 255, 255, .06); border-top: 1px solid rgba(255, 255, 255, .28); }
.fig { position: absolute; bottom: 18px; width: 0; height: 0; }
.fig.ref { left: 27%; --col: #4f8bff; }
.fig.tgt { left: 73%; --col: #ff4f6d; }
.sil { position: absolute; bottom: 0; left: 0; display: block; font-size: 200px; line-height: 1; white-space: nowrap; color: transparent; text-shadow: 0 0 0 var(--col); transform-origin: 0 100%; transition: transform .12s ease-out; pointer-events: none; }
.flabel { position: absolute; left: 0; transform: translateX(-50%); text-align: center; white-space: nowrap; background: rgba(10, 12, 32, .8); border-radius: 8px; padding: 4px 10px; font-size: 13px; line-height: 1.3; max-width: 40vw; overflow: hidden; text-overflow: ellipsis; transition: bottom .12s ease-out; z-index: 2; pointer-events: none; }
.fig.ref .flabel b { color: #8fb4ff; }
.fig.tgt .flabel b { color: #ff8a9c; }
.flabel small { display: block; color: var(--muted); font-weight: 600; }
.fig.tiny::after { content: '▼'; position: absolute; left: 0; bottom: 14px; transform: translateX(-50%); color: var(--col); font-size: 14px; animation: bounce 1.2s infinite; }
.gline { position: absolute; left: 52%; right: 2%; border-top: 2px dashed var(--pc); z-index: 3; animation: fadein .4s backwards; }
.gline.over { border-top-style: dotted; }
.gline span { position: absolute; top: -17px; width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; background: color-mix(in srgb, var(--pc) 35%, var(--bg)); border: 2px solid var(--pc); font-size: 17px; }
.gline span i { position: absolute; top: -14px; font-style: normal; font-weight: 800; color: var(--pc); font-size: 13px; }
.guess.cmp .rval { font-size: clamp(40px, 6vw, 60px); }
.steps { align-items: center; }
.stepbtn { width: 52px; font-size: 22px; padding: 8px 0; }
.intro em { display: block; font-style: normal; font-family: var(--head); font-weight: 800; font-size: 28px; color: var(--acc2); }
@media (max-width: 560px) {
  .stage { height: 280px; }
  .modes { grid-template-columns: 1fr; }
  .flabel { font-size: 11px; padding: 3px 6px; }
}

/* Lobby: Einstellungen und Regeln über die volle Breite */
.lobby-grid .settings, .lobby-grid .rules { grid-column: 1 / -1; }

/* Kontextzeile unter der Frage */
.qctx { margin-top: 10px; color: var(--muted); font-size: 15px; font-weight: 500; line-height: 1.45; }
.qctx b { color: var(--text); font-weight: 600; }
.qcard.slim .qctx { font-size: 14px; }
#langBtn { font-size: 20px; }
</style>
</head>
<body>
<div class="bg"><i></i><i></i><i></i></div>
<header class="topbar">
  <button class="logo" id="logo" aria-label="Size Clash"><span class="mark">📏</span><span>SIZE<b>CLASH</b></span></button>
  <div class="top-right">
    <button class="chip" id="roomChip" hidden><em id="roomLabel">Raum</em> <b id="roomCode"></b> <span>📋</span></button>
    <button class="iconbtn" id="langBtn"></button>
    <button class="iconbtn" id="muteBtn" title="Ton an/aus">🔊</button>
    <button class="iconbtn" id="leaveBtn" hidden title="Raum verlassen">🚪</button>
  </div>
</header>
<main id="app"></main>
<div class="reactbar" id="reactbar" hidden></div>
<div id="toasts"></div>
<div class="overlay" id="overlay" hidden></div>
<div class="overlay" id="busy" hidden><div class="modal card busy"><div class="spinner"></div><p id="busyText"></p></div></div>
<canvas id="confetti" hidden></canvas>

<script>
// Lädt den Fragenkatalog aus src/data/<kategorie>.js.
// Zeile: [Maß, Emoji, Wert in m, Name DE, Frage DE, Fakt DE, Kontext DE, Name TR, Frage TR, Fakt TR, Kontext TR]
// Maß: h = Höhe, l = Länge, b = Breite, d = Durchmesser, x = nicht vergleichbar
window.QUESTIONS = [];
(() => {
  const ids = new Set();
  const slug = s => s.toLowerCase().normalize('NFKD').replace(/[\u0300-\u036f]/g, '')
    .replace(/ß/g, 'ss').replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '').slice(0, 40) || 'q';
  window.Q = (cat, rows) => {
    for (const [d, e, v, n, p, f, c, tn, tp, tf, tc] of rows) {
      let id = slug(n), k = 2;
      while (ids.has(id)) id = slug(n) + '-' + k++;
      ids.add(id);
      window.QUESTIONS.push({ id, cat, d, e, v, n, p, f, c, tr: { n: tn, p: tp, f: tf, c: tc } });
    }
  };
})();

</script>

    if (info.type === 'cmp') { const [a, b] = info.qid.split('~'); return `${qtext(b).n} vs. ${qtext(a).n}`; }
    return `${info.e} ${qtext(info.qid).n}`;
  }
  const plain = x => String(Number(x.toPrecision(3))).replace('.', ',');

  function compare(v, excludeId) {
    const refs = REFS.filter(r => r.id !== excludeId);
    let best = null;
    for (const r of refs) if (r.v <= v * 1.0001) best = r;
    const rn = r => T('refs')[r.id] || r.one;
    if (!best) return `≈ 1/${num(refs[0].v / v, 2)} ${rn(refs[0])}`;
    const k = v / best.v;
    if (k < 1.15) return `≈ 1× ${rn(best)}`;
    return `≈ ${num(k, k < 10 ? 2 : 3)}× ${rn(best)}`;
  }

  function deviation(g, a) {
    const r = g / a;
    if (Math.abs(r - 1) < 0.005) return T('exact');
    if (r >= 1) return r < 2 ? `+${num((r - 1) * 100, 2)} %` : T('tooBig', { k: num(r, 2) });
    return r > 0.5 ? `−${num((1 - r) * 100, 2)} %` : T('tooSmall', { k: num(1 / r, 2) });
  }

  function offText(g, a) {
    const r = g / a;
    if (r > 0.5 && r < 2) return `${num(Math.abs(r - 1) * 100, 2)} %`;
    return T('factor', { k: num(r >= 1 ? r : 1 / r, 2) });
  }

  // ---------- Sound ----------
  const Sound = {
    ctx: null, muted: store.get('muted', false),
    beep(f = 440, d = 0.08, type = 'sine', vol = 0.12, when = 0) {
      if (this.muted) return;
      try {
        this.ctx = this.ctx || new (window.AudioContext || window.webkitAudioContext)();
        const t = this.ctx.currentTime + when;
        const o = this.ctx.createOscillator(); const g = this.ctx.createGain();
        o.type = type; o.frequency.setValueAtTime(f, t);
        g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + d);
        o.connect(g).connect(this.ctx.destination); o.start(t); o.stop(t + d + 0.03);
      } catch { /* kein Audio */ }
    },
    tick() { this.beep(900, 0.05, 'square', 0.04); },
    pop() { this.beep(1100, 0.06, 'sine', 0.08); },
    lock() { this.beep(520, 0.09, 'triangle'); this.beep(780, 0.12, 'triangle', 0.12, 0.07); },
    start() { [392, 523].forEach((f, i) => this.beep(f, 0.14, 'triangle', 0.1, i * 0.1)); },
    reveal() { [523, 659, 784, 1047].forEach((f, i) => this.beep(f, 0.2, 'triangle', 0.1, i * 0.09)); },
    win() { [523, 659, 784, 1047, 784, 1047].forEach((f, i) => this.beep(f, 0.22, 'triangle', 0.1, i * 0.13)); },
  };

  // ---------- Zustand ----------
  const me = { pid: store.get('pid', null) || rid(10), name: store.get('name', ''), avatar: store.get('avatar', AVATARS[Math.floor(Math.random() * AVATARS.length)]) };
  store.set('pid', me.pid);

  let role = null;          // 'host' | 'client'
  let peer = null;
  let hostConn = null;      // Client: Verbindung zum Host
  let roomCode = '';
  let S = null;             // öffentlicher Zustand (vom Host)
  let H = null;             // Host: vollständiger Zustand inkl. Geheimnisse
  let deadline = 0;
  let mounted = '';
  let leaving = false;
  let joinTimer = null;
  const conns = new Map();  // Host: pid -> DataConnection
  let G = {};               // lokale Eingabe der aktuellen Runde

  function peerOpts() {
    const o = {
      debug: 0,
      config: { iceServers: [
        { urls: 'stun:stun.l.google.com:19302' },
        { urls: ['turn:eu-0.turn.peerjs.com:3478', 'turn:us-0.turn.peerjs.com:3478'], username: 'peerjs', credential: 'peerjsp' },
      ] },
    };
    // Optional eigener PeerServer: ?ps=host:port (z. B. für LAN oder Tests)
    const ps = new URLSearchParams(location.search).get('ps');
    if (ps) {
      const [h, p] = ps.split(':');
      Object.assign(o, { host: h, port: +p || 9000, path: '/', secure: location.protocol === 'https:' });
      o.config = { iceServers: [] };
    }
    return o;
  }

  // =====================================================================
  //  HOST
  // =====================================================================
  function createRoom() {
    if (!saveProfile()) return;
    leaving = false; role = 'host';
    busy(T('creating'));
    const code = genCode();
    peer = new Peer(PREFIX + code, peerOpts());
    peer.on('open', () => {
      roomCode = code;
      H = {
        code, phase: 'lobby', settings: { rounds: 10, time: 30, cat: 'all', mode: 'mix' }, players: [], round: 0, total: 0,
        order: [], used: new Set(), q: null, range: null, guesses: {}, reveal: null, final: null,
        deadlineAt: 0, timer: null, best: null, worst: null,
      };
      addPlayer({ pid: me.pid, name: me.name, avatar: me.avatar }, true);
      try { history.replaceState(null, '', location.pathname + location.search + '#' + code); } catch { /* file:// */ }
      unbusy();
      publish();
    });
    peer.on('connection', conn => {
      conn.on('data', d => onHostMsg(conn, d));
      conn.on('close', () => onHostClose(conn));
      conn.on('error', () => onHostClose(conn));
    });
    peer.on('disconnected', () => {
      if (leaving) return;
      setTimeout(() => { try { if (peer && !peer.destroyed && peer.disconnected) peer.reconnect(); } catch { /* ignore */ } }, 1500);
    });
    peer.on('error', e => {
      if (!H) {
        if (e.type === 'unavailable-id') { peer.destroy(); createRoom(); return; }
        unbusy(); peer.destroy(); role = null;
        overlay(T('connFailTitle'), T('connFailServer') + errDetail(e), [{ t: 'OK', primary: true }]);
        return;
      }
      if (['network', 'server-error', 'socket-error', 'socket-closed'].includes(e.type)) toast(T('serverWobble'));
    });
  }

  function addPlayer(info, isHost = false) {
    let name = String(info.name || 'Spieler').replace(/\s+/g, ' ').trim().slice(0, 16) || 'Spieler';
    const base = name; let i = 2;
    while (H.players.some(p => p.name.toLowerCase() === name.toLowerCase())) name = `${base.slice(0, 13)} ${i++}`;
    const used = H.players.map(p => p.color);
    const color = COLORS.find(c => !used.includes(c)) || COLORS[H.players.length % COLORS.length];
    const avatar = AVATARS.includes(info.avatar) ? info.avatar : AVATARS[0];
    const p = { pid: info.pid, name, avatar, color, score: 0, online: true, host: isHost, joker: true, wins: 0, hits: 0 };
    H.players.push(p);
    return p;
  }

  const findP = pid => H.players.find(p => p.pid === pid);

  function onHostMsg(conn, d) {
    if (!d || typeof d !== 'object') return;
    if (d.t === 'hello') {
      const pid = String(d.pid || '').slice(0, 24) || rid(10);
      let p = findP(pid);
      if (p && p.host) { conn.send({ t: 'reject', code: 'rejId' }); return; }
      if (!p) {
        if (H.players.length >= MAX_PLAYERS) {
          conn.send({ t: 'reject', code: 'rejFull', n: MAX_PLAYERS });
          setTimeout(() => { try { conn.close(); } catch { /* ignore */ } }, 800);
          return;
        }
        p = addPlayer({ pid, name: d.name, avatar: d.avatar });
        toast(T('joined', { who: `${p.avatar} ${esc(p.name)}` }));
      } else {
        p.online = true;
        const old = conns.get(pid);
        if (old && old !== conn) { old._replaced = true; try { old.close(); } catch { /* ignore */ } }
        toast(T('back', { who: `${p.avatar} ${esc(p.name)}` }));
      }
      conn.pid = pid;
      conns.set(pid, conn);
      conn.send({ t: 'welcome', pid });
      publish();
      return;
    }
    const pid = conn.pid;
    if (!pid) return;
    if (d.t === 'guess') return guessIn(pid, d);
    if (d.t === 'react') {
      const now = Date.now();
      if (!REACTIONS.includes(d.e) || now - (conn._lastReact || 0) < 500) return;
      conn._lastReact = now;
      const msg = { t: 'react', pid, e: d.e };
      broadcast(msg); onClientMsg(msg);
    }
  }

  function onHostClose(conn) {
    if (conn._replaced || !conn.pid || conns.get(conn.pid) !== conn) return;
    conns.delete(conn.pid);
    const p = findP(conn.pid);
    if (!p) return;
    if (H.phase === 'lobby') H.players = H.players.filter(x => x !== p);
    else p.online = false;
    toast(T('left', { who: `${p.avatar} ${esc(p.name)}` }));
    publish();
    if (H.phase === 'question') checkAllLocked();
  }

  function guessIn(pid, d) {
    if (H.phase !== 'question') return;
    const p = findP(pid); if (!p) return;
    const g = H.guesses[pid]; if (g && g.locked) return;
    const v = +d.v; if (!(v > 0 && isFinite(v))) return;
    H.guesses[pid] = { v, locked: !!d.lock, joker: !!d.joker && p.joker };
    if (d.lock) { publish(); checkAllLocked(); }
  }

  function checkAllLocked() {
    const on = H.players.filter(p => p.online);
    if (on.length && on.every(p => H.guesses[p.pid]?.locked)) {
      clearTimeout(H.timer);
      H.timer = setTimeout(endRound, 700);
    }
  }

  function makeRange(a) {
    const u = 1.3 + Math.random() * 3.4;
    const lo = Math.pow(10, Math.floor(Math.log10(a) - u));
    return { lo, hi: lo * 1e6 };
  }

  function makeRatioRange(r) {
    const u = 1 + Math.random() * 1.9;
    const lo = Math.pow(10, Math.floor(Math.log10(r) - u));
    return { lo, hi: lo * 1e4 };
  }

  // Vergleichspaar: Ziel b aus bPool, Referenz a aus aPool (gleiches Maß, sinnvolles Verhältnis)
  function pickPair(bPool, aPool, taken) {
    const freshB = bPool.filter(q => !taken.has(q.id)), freshA = aPool.filter(q => !taken.has(q.id));
    const srcB = freshB.length > 4 ? freshB : bPool, srcA = freshA.length > 8 ? freshA : aPool;
    for (let t = 0; t < 600; t++) {
      const b = srcB[Math.floor(Math.random() * srcB.length)];
      const a = srcA[Math.floor(Math.random() * srcA.length)];
      if (!a || !b || a === b || a.d !== b.d || taken.has(a.id + '~') || taken.has(b.id + '~')) continue;
      const lr = Math.abs(Math.log10(b.v / a.v));
      if (lr < 0.06 || lr > 2.6) continue;
      taken.add(a.id + '~'); taken.add(b.id + '~');
      return { type: 'cmp', a: a.id, b: b.id };
    }
    return null;
  }

  function buildRounds() {
    const st = H.settings;
    // Bei „Alles gemischt“ zuerst eine Kategorie gleichverteilt ziehen, dann eine Frage daraus,
    // damit große Kategorien nicht dominieren.
    const cats = st.cat === 'all' ? Object.keys(CATS).filter(c => c !== 'all') : [st.cat];
    const fresh = qs => shuffle(qs).sort((a, b) => H.used.has(a.id) - H.used.has(b.id)); // neue Fragen zuerst
    const guessPool = Object.fromEntries(cats.map(c => [c, fresh(window.QUESTIONS.filter(q => q.cat === c))]));
    const cmpAll = window.QUESTIONS.filter(q => q.d !== 'x');
    const cmpPool = Object.fromEntries(cats.map(c => [c, cmpAll.filter(q => q.cat === c)]));
    const taken = new Set(H.used);
    const start = Math.random() < 0.5 ? 0 : 1;
    let bag = [];
    const nextCat = () => { if (!bag.length) bag = shuffle(cats.slice()); return bag.pop(); };
    const rounds = [];
    for (let i = 0, tries = 0; rounds.length < st.rounds && tries < st.rounds * 20; tries++, i++) {
      const wantCmp = st.mode === 'cmp' || (st.mode === 'mix' && i % 2 === start);
      const c = nextCat();
      let r = null;
      if (wantCmp) {
        const own = cmpPool[c];
        if (own.length >= 3) r = pickPair(own, own.length >= 12 ? own : cmpAll, taken);
        if (!r && st.cat !== 'all') r = pickPair(cmpAll, cmpAll, taken);
        if (!r && st.mode === 'cmp') continue;
      }
      if (!r) {
        const q = guessPool[c].find(x => !taken.has(x.id + '~'));
        if (!q) continue;
        taken.add(q.id + '~');
        r = { type: 'guess', id: q.id };
      }
      rounds.push(r);
    }
    return rounds;
  }

  function startGame() {
    H.order = buildRounds();
    H.total = H.order.length; H.round = 0; H.best = null; H.worst = null; H.final = null;
    H.players = H.players.filter(p => p.online);
    H.players.forEach(p => Object.assign(p, { score: 0, joker: true, wins: 0, hits: 0 }));
    nextRound();
  }

  function nextRound() {
    clearTimeout(H.timer);
    H.round++;
    if (H.round > H.total) return finish();
    const spec = H.order[H.round - 1];
    if (spec.type === 'cmp') {
      const a = QBYID[spec.a], b = QBYID[spec.b];
      H.q = { type: 'cmp', id: a.id + '~' + b.id, d: a.d, cat: b.cat, ref: a, tgt: b, v: b.v / a.v, e: b.e, n: `${b.n} vs. ${a.n}`, f: b.f };
      H.used.add(a.id); H.used.add(b.id);
      H.range = makeRatioRange(H.q.v);
    } else {
      H.q = Object.assign({ type: 'guess' }, QBYID[spec.id]);
      H.used.add(H.q.id);
      H.range = makeRange(H.q.v);
    }
    H.guesses = {}; H.reveal = null; H.phase = 'question';
    const ms = H.settings.time * 1000 + INTRO_MS;
    H.deadlineAt = Date.now() + ms;
    H.timer = setTimeout(endRound, ms + 300);
    publish();
  }

  function rankOf(players) {
    const sorted = players.slice().sort((a, b) => b.score - a.score);
    return Object.fromEntries(players.map(p => [p.pid, sorted.findIndex(x => x.score === p.score) + 1]));
  }

  function endRound() {
    if (H.phase !== 'question') return;
    clearTimeout(H.timer);
    const a = H.q.v;
    const before = rankOf(H.players);
    const res = [];
    for (const p of H.players) {
      const g = H.guesses[p.pid];
      if (!g) { if (p.online) res.push({ pid: p.pid, v: null, err: 99, base: 0, pts: 0 }); continue; }
      const err = Math.abs(Math.log10(g.v / a));
      const base = Math.round(1000 * Math.max(0, 1 - err));
      const hit = err <= HIT;
      let pts = base + (hit ? 150 : 0);
      let joker = null;
      if (g.joker && p.joker) {
        p.joker = false;
        joker = base >= JOKER_MIN ? 'win' : 'lose';
        pts = joker === 'win' ? pts * 2 : 0;
      }
      res.push({ pid: p.pid, v: g.v, err, base, hit, pts, joker, locked: g.locked });
    }
    const valid = res.filter(r => r.v != null);
    if (valid.length > 1) {
      const m = Math.min(...valid.map(r => r.err));
      valid.filter(r => r.err === m).forEach(r => { r.crown = true; r.pts += 100; });
    }
    for (const r of res) {
      const p = findP(r.pid);
      p.score += r.pts;
      if (r.crown) p.wins++;
      if (r.hit) p.hits++;
    }
    const after = rankOf(H.players);
    for (const r of res) { r.total = findP(r.pid).score; r.move = before[r.pid] - after[r.pid]; }
    for (const r of valid) {
      const info = { pid: r.pid, err: r.err, v: r.v, a, qid: H.q.id, type: H.q.type, e: H.q.e };
      if (!H.best || r.err < H.best.err) H.best = info;
      if (!H.worst || r.err > H.worst.err) H.worst = info;
    }
    res.sort((x, y) => x.err - y.err);
    H.reveal = { a, f: H.q.f, res };
    if (H.q.type === 'cmp') Object.assign(H.reveal, { refV: H.q.ref.v, tgtV: H.q.tgt.v });
    H.phase = 'reveal';
    H.deadlineAt = Date.now() + REVEAL_MS;
    H.timer = setTimeout(advance, REVEAL_MS);
    publish();
  }

  function advance() {
    clearTimeout(H.timer);
    if (H.phase === 'question') return endRound();
    if (H.round >= H.total) finish(); else nextRound();
  }

  function finish() {
    clearTimeout(H.timer);
    H.phase = 'final'; H.deadlineAt = 0;
    H.final = { best: H.best, worst: H.worst };
    publish();
  }

  function toLobby() {
    clearTimeout(H.timer);
    H.phase = 'lobby'; H.q = null; H.reveal = null; H.final = null; H.deadlineAt = 0; H.round = 0;
    H.players = H.players.filter(p => p.online);
    H.players.forEach(p => Object.assign(p, { score: 0, joker: true, wins: 0, hits: 0 }));
    publish();
  }

  function publicState() {
    return {
      code: H.code, phase: H.phase, settings: H.settings, round: H.round, total: H.total,
      players: H.players.map(({ pid, name, avatar, color, score, online, host, joker, wins, hits }) => ({ pid, name, avatar, color, score, online, host, joker, wins, hits })),
      q: H.q && H.phase !== 'lobby' ? (H.q.type === 'cmp'
        ? { type: 'cmp', id: H.q.id, d: H.q.d, cat: H.q.cat, e: H.q.e, n: H.q.n, lo: H.range.lo, hi: H.range.hi,
          ref: { id: H.q.ref.id, e: H.q.ref.e, n: H.q.ref.n }, tgt: { id: H.q.tgt.id, e: H.q.tgt.e, n: H.q.tgt.n } }
        : { type: 'guess', id: H.q.id, e: H.q.e, n: H.q.n, p: H.q.p, cat: H.q.cat, lo: H.range.lo, hi: H.range.hi }) : null,
      locked: H.phase === 'question' ? Object.keys(H.guesses).filter(k => H.guesses[k].locked) : [],
      reveal: H.phase === 'reveal' || H.phase === 'final' ? H.reveal : null,
      final: H.phase === 'final' ? H.final : null,
      remaining: H.deadlineAt ? Math.max(0, H.deadlineAt - Date.now()) : null,
    };
  }

  function broadcast(msg) {
    for (const c of conns.values()) { try { if (c.open) c.send(msg); } catch { /* ignore */ } }
  }

  function publish() {
    const s = publicState();
    broadcast({ t: 'state', s });
    applyState(s);
  }

  // =====================================================================
  //  CLIENT
  // =====================================================================
  function joinRoom(code) {
    if (!saveProfile()) return;
    code = String(code || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
    if (code.length !== 5) { shake($('#codeIn')); toast(T('codeInvalid')); return; }
    teardown(true);
    leaving = false; role = 'client'; roomCode = code;
    busy(T('connecting', { code }));
    peer = new Peer(peerOpts());
    peer.on('open', () => {
      hostConn = peer.connect(PREFIX + code, { reliable: true, serialization: 'json' });
      hostConn.on('open', () => hostConn.send({ t: 'hello', pid: me.pid, name: me.name, avatar: me.avatar }));
      hostConn.on('data', onClientMsg);
      hostConn.on('close', onLost);
      hostConn.on('error', onLost);
    });
    peer.on('error', e => {
      if (e.type === 'peer-unavailable') { joinFailed(T('roomNotFound', { code })); return; }
      if (!S) joinFailed(T('connFail') + errDetail(e));
    });
    peer.on('disconnected', () => {
      if (leaving) return;
      setTimeout(() => { try { if (peer && !peer.destroyed && peer.disconnected) peer.reconnect(); } catch { /* ignore */ } }, 1500);
    });
    clearTimeout(joinTimer);
    joinTimer = setTimeout(() => { if (!S && role === 'client') joinFailed(T('timeout')); }, 15000);
  }

  function joinFailed(msg) {
    clearTimeout(joinTimer);
    teardown(true);
    unbusy();
    S = null; role = null; mounted = '';
    render();
    overlay(T('joinFailTitle'), msg, [{ t: 'OK', primary: true }]);
  }

  function onClientMsg(d) {
    if (!d || typeof d !== 'object') return;
    switch (d.t) {
      case 'welcome': clearTimeout(joinTimer); unbusy(); closeOverlay(); break;
      case 'state': applyState(d.s); break;
      case 'react': showReaction(d.pid, d.e); break;
      case 'reject': joinFailed(d.code ? T(d.code, { n: d.n }) : (d.reason || T('rejected'))); break;
      case 'kicked': leaving = true; teardown(true); S = null; mounted = ''; render(); overlay(T('kickedTitle'), T('kickedText'), [{ t: 'OK', primary: true }]); break;
      case 'bye': leaving = true; teardown(true); S = null; mounted = ''; render(); overlay(T('byeTitle'), T('byeText'), [{ t: 'OK', primary: true }]); break;
    }
  }

  function onLost() {
    if (leaving || role !== 'client') return;
    if (!S) return; // Fehler beim Beitritt wird separat behandelt
    const code = roomCode;
    overlay(T('lostTitle'), T('lostText'), [
      { t: T('reconnect'), primary: true, fn: () => joinRoom(code) },
      { t: T('toHome'), fn: () => leave(true) },
    ]);
  }

  function send(msg) {
    if (role === 'host') onHostMsg({ pid: me.pid, send() {} }, msg);
    else if (hostConn && hostConn.open) { try { hostConn.send(msg); } catch { /* ignore */ } }
  }

  function teardown(silent) {
    leaving = true;
    clearTimeout(joinTimer);
    if (H) clearTimeout(H.timer);
    if (role === 'host' && !silent) broadcast({ t: 'bye' });
    try { if (peer) peer.destroy(); } catch { /* ignore */ }
    peer = null; hostConn = null; conns.clear(); H = null;
  }

  function leave(force) {
    if (!force && role === 'host' && S && S.players.length > 1 && !confirm(T('confirmHostLeave'))) return;
    if (!force && role === 'client' && !confirm(T('confirmLeave'))) return;
    const wasHost = role === 'host';
    if (wasHost) broadcast({ t: 'bye' });
    const oldPeer = peer;
    leaving = true;
    clearTimeout(joinTimer);
    if (H) clearTimeout(H.timer);
    peer = null; hostConn = null; conns.clear(); H = null;
    setTimeout(() => { try { if (oldPeer) oldPeer.destroy(); } catch { /* ignore */ } }, wasHost ? 300 : 0);
    S = null; role = null; mounted = ''; roomCode = '';
    try { history.replaceState(null, '', location.pathname + location.search); } catch { /* ignore */ }
    closeOverlay();
    render();
  }

  // =====================================================================
  //  RENDERING
  // =====================================================================
  const app = () => $('#app');
  const myP = () => S && S.players.find(p => p.pid === me.pid);
  const isHost = () => role === 'host';
  const pById = pid => S.players.find(p => p.pid === pid);

  function applyState(s) {
    const prev = S;
    S = s;
    if (s.remaining != null) deadline = Date.now() + s.remaining;
    if (prev && prev.phase !== s.phase) {
      if (s.phase === 'question') Sound.start();
      if (s.phase === 'reveal') Sound.reveal();
      if (s.phase === 'final') Sound.win();
    } else if (!prev && s.phase === 'question') Sound.start();
    if (prev && s.phase === 'question' && prev.phase === 'question' && s.locked.length > prev.locked.length) Sound.pop();
    render();
  }

  function render() {
    updateHeader();
    if (!S) { if (mounted !== 'home') { mounted = 'home'; renderHome(); } return; }
    const key = S.phase + ':' + S.round;
    const fresh = key !== mounted;
    mounted = key;
    ({ lobby: renderLobby, question: renderQuestion, reveal: renderReveal, final: renderFinal })[S.phase](fresh);
    $('#reactbar').hidden = false;
  }

  function updateHeader() {
    const inRoom = !!S;
    $('#roomChip').hidden = !inRoom;
    $('#leaveBtn').hidden = !inRoom;

    $('#muteBtn').textContent = Sound.muted ? '🔇' : '🔊';
    $('#muteBtn').title = T('mute');
    $('#leaveBtn').title = T('leave');
    $('#roomChip').title = T('copyInvite');
    $('#roomLabel').textContent = T('room');
    $('#langBtn').textContent = T('other');
    $('#langBtn').title = T('switchTitle');
  }

  // ---------- Lobby ----------
  function inviteLink() {
    if (!/^https?:/.test(location.protocol)) return '';
    return location.origin + location.pathname + location.search + '#' + S.code;
  }

  const seenSlots = new Set();
  function renderLobby(fresh) {
    const host = isHost();
    const st = S.settings;
    const link = inviteLink();
    const slots = [];
    for (let i = 0; i < MAX_PLAYERS; i++) {
      const p = S.players[i];
      slots.push(p ? `
        <div class="pslot ${seenSlots.has(p.pid) ? 'seen' : ''}" style="--pc:${p.color}">
          <div class="pav">${p.avatar}</div>
          <div class="pname">${esc(p.name)}${p.pid === me.pid ? ` <em>${T('you')}</em>` : ''}</div>
          ${p.host ? '<div class="badge">HOST</div>' : ''}
          ${host && !p.host ? `<button class="kick" data-kick="${esc(p.pid)}" title="${T('kick')}">✕</button>` : ''}

      </div>`;
    const catCount = c => window.QUESTIONS.filter(q => c === 'all' || q.cat === c).length;
    app().innerHTML = `
