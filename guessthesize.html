            : `<div class="waiting"><span class="dots"><i></i><i></i><i></i></span> Warte, bis der Host das Spiel startet …</div>`}
        </div>
      </section>`;
    S.players.forEach(p => seenSlots.add(p.pid));
    $('#copyCode').onclick = () => copy(S.code, 'Code kopiert');
    if (link) $('#copyLink').onclick = () => copy(link, 'Link kopiert');
    if (host) {
      $$('[data-set]').forEach(b => b.onclick = () => {
        const k = b.dataset.set; const v = k === 'cat' || k === 'mode' ? b.dataset.val : +b.dataset.val;
        H.settings[k] = v; Sound.pop(); publish();
      });
      $$('[data-kick]').forEach(b => b.onclick = () => {
        const c = conns.get(b.dataset.kick);
        if (c) { try { c.send({ t: 'kicked' }); } catch { /* ignore */ } setTimeout(() => { try { c.close(); } catch { /* ignore */ } }, 200); }
        H.players = H.players.filter(p => p.pid !== b.dataset.kick); conns.delete(b.dataset.kick); publish();
      });
      $('#startBtn').onclick = startGame;
    }
  }

  // ---------- Frage ----------
  function posToVal(pos) { const q = S.q; return q.lo * Math.pow(q.hi / q.lo, pos / 1000); }
  function valToPos(v) { const q = S.q; return clamp(Math.log(v / q.lo) / Math.log(q.hi / q.lo) * 1000, 0, 1000); }

  function questionShell(q, body, kicker) {
    const cat = CATS[q.cat] || CATS.all;
    return `
        <section class="screen game">
          <div class="gamebar">
            <div class="pill">Runde <b>${S.round}</b> / ${S.total}</div>
            <div class="pill cat">${q.type === 'cmp' ? '⚖️ Größenvergleich' : `${cat.e} ${cat.n}`}</div>
            ${timerHtml()}
          </div>
          ${kicker}
          <div class="card guess ${q.type}" id="guessCard">
            ${body}
            <div class="lockedmsg" id="lockedMsg" hidden></div>
          </div>
          <div class="lockstrip" id="lockstrip"></div>
          <div class="intro" id="intro"><div><small>Runde ${S.round} von ${S.total}</small><b>${q.type === 'cmp' ? '⚖️' : q.e}</b>${q.type === 'cmp' ? '<em>Größenvergleich</em>' : ''}</div></div>
        </section>`;
  }

  const lockControls = `
              <button id="jokerBtn" class="btn joker" title="Mindestens 700 Punkte: doppelt. Sonst: 0.">🃏 Joker</button>
              <button id="lockBtn" class="btn primary lockbtn">Tipp festlegen <kbd>Enter</kbd></button>`;

  function bindCommon() {
    $('#lockBtn').onclick = lockIn;
    $('#jokerBtn').onclick = () => { if (G.locked || !myP()?.joker) return; G.joker = !G.joker; Sound.pop(); updateGuessUi(); queueSend(true); };
    setTimeout(() => { const el = $('#intro'); if (el) el.remove(); }, INTRO_MS);
  }

  function mountGuess(q) {
    G.cur = Math.sqrt(q.lo * q.hi);
    const ticks = [];
    for (let k = 0; k <= 6; k++) ticks.push(`<span style="left:${k / 6 * 100}%">${fmt(q.lo * Math.pow(10, k), 1)}</span>`);
    app().innerHTML = questionShell(q, `
            <div class="readout">
              <div class="rval"><span id="rNum"></span><span id="rUnit"></span></div>
              <div class="rcmp" id="rCmp"></div>
            </div>
            <div class="slider-wrap">
              <input type="range" id="slider" min="0" max="1000" step="1" value="500" aria-label="Schätzung">
              <div class="ticks">${ticks.join('')}</div>
            </div>
            <div class="controls">
              <div class="exact">
                <input id="numIn" inputmode="decimal" autocomplete="off" aria-label="Exakter Wert">
                <select id="unitSel">${UNITS.map(u => `<option value="${u.k}">${u.k}</option>`).join('')}</select>
              </div>
              ${lockControls}
            </div>`, `
          <div class="qcard">
            <div class="qemoji">${q.e}</div>
            <div class="qtext"><div class="qname">${esc(q.n)}</div><h2>${esc(q.p)}</h2></div>
          </div>`);
    const slider = $('#slider');
    slider.value = valToPos(G.cur);
    slider.oninput = () => { G.cur = posToVal(+slider.value); G.touched = true; syncInputs(); readout(); queueSend(); };
    $('#numIn').oninput = onExact;
    $('#unitSel').onchange = onExact;
    $('#numIn').onkeydown = e => { if (e.key === 'Enter') lockIn(); };
    bindCommon();
    syncInputs(); readout();
  }

  // ---------- Größenvergleich: Bühne mit Silhouetten ----------
  const SIL = 200; // Basis-Schriftgröße der Silhouetten in px
  function stageHtml(q, labels) {
    const fig = (k, o, lab) => `<div class="fig ${k}"><div class="flabel"><b>${esc(o.n)}</b><small>${lab}</small></div><span class="sil">${o.e}</span></div>`;
    return `<div class="stage" id="stage">${fig('ref', q.ref, labels[0])}${fig('tgt', q.tgt, labels[1])}<div class="ground"></div><div id="glines"></div></div>`;
  }
  function setFig(fig, h) {
    $('.sil', fig).style.transform = `scale(${h / SIL}) translateX(-50%)`;
    $('.flabel', fig).style.bottom = (h < 14 ? h + 30 : h + 10) + 'px';
    fig.classList.toggle('tiny', h < 14);
  }
  function layoutStage(r) {
    const st = $('#stage'); if (!st) return 0;
    const W = st.clientWidth, Hh = st.clientHeight - 18;
    const maxPx = Math.max(40, Math.min(Hh - 66, W * 0.34));
    const unit = maxPx / Math.max(1, r);
    setFig($('.fig.ref', st), unit);
    setFig($('.fig.tgt', st), unit * r);
    return unit;
  }

  function mountCmp(q) {
    G.cur = clamp(1, q.lo, q.hi);
    const w = DIMW[q.d];
    const ticks = [];
    for (let k = 0; k <= 4; k++) ticks.push(`<span style="left:${k / 4 * 100}%">${fmtRatio(q.lo * Math.pow(10, k))}</span>`);
    app().innerHTML = questionShell(q, `
            ${stageHtml(q, [w.noun + ' ?', w.noun + ' ?'])}
            <div class="readout">
              <div class="rval"><span id="rNum"></span></div>
              <div class="rcmp" id="rCmp"></div>
            </div>
            <div class="slider-wrap">
              <input type="range" id="slider" min="0" max="1000" step="1" value="500" aria-label="Größenverhältnis">
              <div class="ticks">${ticks.join('')}</div>
            </div>
            <div class="controls">
              <div class="exact steps">
                <button class="btn stepbtn" id="minusBtn" title="Kleiner (Taste −)">−</button>
                <button class="btn stepbtn" id="plusBtn" title="Größer (Taste +)">+</button>
                <span class="hint">Ziehen, Mausrad oder Regler</span>
              </div>
              ${lockControls}
            </div>`, `
          <div class="qcard slim">
            <div class="qtext"><div class="qname">Größenvergleich · ${w.noun}</div>
            <h2>Wie ${w.adj} ist <span class="t-red">${esc(q.tgt.n)}</span> im Vergleich zu <span class="t-blue">${esc(q.ref.n)}</span>?</h2></div>
          </div>`);
    const slider = $('#slider');
    slider.value = valToPos(G.cur);
    slider.oninput = () => { G.cur = posToVal(+slider.value); G.touched = true; cmpReadout(); queueSend(); };
    $('#minusBtn').onclick = () => nudge(-15);
    $('#plusBtn').onclick = () => nudge(15);
    const st = $('#stage');
    st.addEventListener('wheel', e => { e.preventDefault(); nudge(e.deltaY < 0 ? 10 : -10); }, { passive: false });
    let dragY = null;
    st.addEventListener('pointerdown', e => { if (G.locked) return; dragY = e.clientY; st.setPointerCapture(e.pointerId); });
    st.addEventListener('pointermove', e => { if (dragY == null) return; const d = dragY - e.clientY; if (Math.abs(d) >= 2) { nudge(d * 1.6); dragY = e.clientY; } });
    const end = () => { dragY = null; };
    st.addEventListener('pointerup', end); st.addEventListener('pointercancel', end);
    bindCommon();
    cmpReadout();
  }

  function nudge(d) {
    if (G.locked || !S || S.phase !== 'question') return;
    const slider = $('#slider');
    slider.value = clamp(+slider.value + d, 0, 1000);
    G.cur = posToVal(+slider.value); G.touched = true;
    if (S.q.type === 'cmp') cmpReadout(); else { syncInputs(); readout(); }
    queueSend();
  }

  function cmpReadout() {
    $('#rNum').textContent = fmtRatio(G.cur);
    $('#rCmp').textContent = ratioSentence(S.q, G.cur);
    layoutStage(G.cur);
  }

  function updateLockstrip() {
    $('#lockstrip').innerHTML = S.players.filter(p => p.online).map(p => {
      const l = S.locked.includes(p.pid);
      return `<div class="lchip ${l ? 'done' : ''}" style="--pc:${p.color}"><span>${p.avatar}</span>${esc(p.name)}<i>${l ? '✓' : '…'}</i></div>`;
    }).join('');
  }

  function renderQuestion(fresh) {
    const q = S.q;
    if (fresh) {
      G = { round: S.round, cur: 1, touched: false, locked: S.locked.includes(me.pid), known: false, joker: false, sendT: null };
      if (q.type === 'cmp') mountCmp(q); else mountGuess(q);
    }
    if (S.locked.includes(me.pid)) G.locked = true;
    updateGuessUi();
    updateLockstrip();
  }

  function onExact() {
    const raw = $('#numIn').value.replace(/\s/g, '').replace(',', '.');
    const n = parseFloat(raw);
    const u = UNITS.find(x => x.k === $('#unitSel').value);
    if (!(n > 0) || !u) return;
    G.cur = n * u.f; G.touched = true;
    $('#slider').value = valToPos(G.cur);
    readout(); queueSend();
  }

  function syncInputs() {
    const u = bestUnit(G.cur);
    $('#numIn').value = plain(G.cur / u.f);
    $('#unitSel').value = u.k;
  }

  function readout() {
    const [n, u] = fmtParts(G.cur, 3);
    $('#rNum').textContent = n; $('#rUnit').textContent = u;
    $('#rCmp').textContent = compare(G.cur, S.q.id);
  }

  function queueSend(now) {
    if (G.locked) return;
    clearTimeout(G.sendT);
    G.sendT = setTimeout(() => { if (!G.locked && S && S.phase === 'question') send({ t: 'guess', v: G.cur, lock: false, joker: G.joker }); }, now ? 0 : 200);
  }

  function lockIn() {
    if (G.locked || !S || S.phase !== 'question') return;
    clearTimeout(G.sendT);
    G.locked = true; G.known = true;
    send({ t: 'guess', v: G.cur, lock: true, joker: G.joker });
    Sound.lock();
    updateGuessUi();
  }

  function updateGuessUi() {
    const card = $('#guessCard'); if (!card) return;
    const mine = myP();
    const jokerAvail = !!mine?.joker;
    card.classList.toggle('locked', G.locked);
    card.classList.toggle('joker-on', G.joker);
    ['#slider', '#numIn', '#unitSel', '#lockBtn', '#minusBtn', '#plusBtn'].forEach(s => { const el = $(s); if (el) el.disabled = G.locked; });
    const jb = $('#jokerBtn');
    jb.disabled = G.locked || !jokerAvail;
    jb.classList.toggle('on', G.joker);
    jb.textContent = jokerAvail || G.joker ? (G.joker ? '🃏 Joker aktiv!' : '🃏 Joker') : '🃏 verbraucht';
    const lm = $('#lockedMsg');
    lm.hidden = !G.locked;
    if (G.locked) lm.innerHTML = G.known
      ? `🔒 Festgelegt: <b>${fmtVal(S.q, G.cur, 3)}</b>${G.joker ? ' · 🃏 Joker gesetzt' : ''}. Warte auf die anderen …`
      : '🔒 Festgelegt. Warte auf die anderen …';
  }

  // ---------- Timer ----------
  function timerHtml() {
    return `<div class="timer" id="timer"><svg viewBox="0 0 44 44"><circle class="trk" r="19" cx="22" cy="22"/><circle class="bar" id="timerBar" r="19" cx="22" cy="22"/></svg><span id="timerNum"></span></div>`;
  }
  let lastSec = -1;
  setInterval(() => {
    const el = $('#timerNum'); if (!el || !S) return;
    const left = Math.max(0, deadline - Date.now());
    const total = S.phase === 'question' ? S.settings.time * 1000 : REVEAL_MS;
    const shown = Math.min(left, total);
    const sec = Math.ceil(shown / 1000);
    el.textContent = sec;
    const bar = $('#timerBar');
    const C = 2 * Math.PI * 19;
    bar.style.strokeDasharray = C;
    bar.style.strokeDashoffset = C * (1 - shown / total);
    const urgent = S.phase === 'question' && sec <= 5 && !G.locked;
    $('#timer').classList.toggle('urgent', urgent);
    if (urgent && sec !== lastSec && sec > 0) Sound.tick();
    lastSec = sec;
    const an = $('#autoNext'); if (an) an.textContent = sec;
  }, 150);

  // ---------- Auflösung ----------
  function renderReveal(fresh) {
    if (!fresh) { renderRevealFooter(); return; }
    const q = S.q; const R = S.reveal;
    const isCmp = q.type === 'cmp';
    const guesses = R.res.filter(r => r.v != null);
    const vals = [R.a, ...guesses.map(r => r.v)].map(v => Math.log10(v));
    let lmin = Math.min(...vals) - 0.35, lmax = Math.max(...vals) + 0.35;
    if (lmax - lmin < 1.2) { const m = (lmax + lmin) / 2; lmin = m - 0.6; lmax = m + 0.6; }
    const pos = v => (Math.log10(v) - lmin) / (lmax - lmin) * 100;
    const ticks = [];
    for (let k = Math.ceil(lmin); k <= Math.floor(lmax); k++) ticks.push(`<span style="left:${pos(Math.pow(10, k))}%">${fmt(Math.pow(10, k), 1)}</span>`);
    const sorted = guesses.slice().sort((a, b) => a.v - b.v);
    const lanes = [];
    const markers = sorted.map((r, i) => {
      const p = pById(r.pid); const x = pos(r.v);
      let lane = lanes.findIndex(last => x - last > 7);
      if (lane === -1) { lane = lanes.length; lanes.push(x); } else lanes[lane] = x;
      return `<div class="gm" style="left:${x}%;--lane:${lane};--pc:${p?.color || '#888'};animation-delay:${0.25 + i * 0.12}s" title="${esc(p?.name)}: ${fmt(r.v)}"><span>${p?.avatar || '❔'}</span></div>`;
    });
    const rows = R.res.map((r, i) => {
      const p = pById(r.pid); if (!p) return '';
      const tags = [r.hit ? '<span class="tag hit">🎯 Volltreffer</span>' : '', r.crown ? '<span class="tag crown">👑 Rundensieg</span>' : '',
        r.joker === 'win' ? '<span class="tag jw">🃏 Joker ×2</span>' : '', r.joker === 'lose' ? '<span class="tag jl">🃏 Joker verzockt</span>' : ''].join('');
      const mv = r.move > 0 ? `<i class="up">▲${r.move}</i>` : r.move < 0 ? `<i class="down">▼${-r.move}</i>` : '';
      return `<div class="rrow ${p.pid === me.pid ? 'me' : ''}" style="--pc:${p.color};animation-delay:${0.9 + i * 0.08}s">
        <div class="rk">${r.v != null ? i + 1 : '–'}</div>
        <div class="ra">${p.avatar}</div>
        <div class="rn"><b>${esc(p.name)}</b><div class="tags">${tags}</div></div>
        <div class="rg">${r.v != null ? `${fmtVal(q, r.v)}<small>${deviation(r.v, R.a)}</small>` : '<small>kein Tipp</small>'}</div>
        <div class="rp">+${r.pts}</div>
        <div class="rt">${r.total}${mv}</div>
      </div>`;
    }).join('');
    app().innerHTML = `
      <section class="screen reveal">
        <div class="gamebar">
          <div class="pill">Runde <b>${S.round}</b> / ${S.total}</div>
          <div class="qmini">${isCmp ? `⚖️ ${esc(q.tgt.n)} vs. ${esc(q.ref.n)}` : `${q.e} ${esc(q.p)}`}</div>
          ${timerHtml()}
        </div>
        <div class="answer card">
          <div class="aemoji">${isCmp ? '⚖️' : q.e}</div>
          <div>
            <div class="kicker">Richtige Antwort</div>
            <div class="abig" id="abig">…</div>
            <div class="acmp">${isCmp ? esc(ratioSentence(q, R.a)) : compare(R.a, q.id)}</div>
          </div>
        </div>
        ${isCmp ? `<div class="card stage-card">${stageHtml(q, [fmt(R.refV, 4), fmt(R.tgtV, 4)])}</div>` : `
        <div class="card ruler-card">
          <div class="ruler">
            <div class="line"></div>
            ${markers.join('')}
            <div class="am" style="left:${pos(R.a)}%"><div class="flag">🎯 ${fmt(R.a, 4)}</div></div>
            <div class="rticks">${ticks.join('')}</div>
          </div>
        </div>`}
        <div class="card results">
          <div class="rrow head"><div class="rk">#</div><div class="ra"></div><div class="rn">Spieler</div><div class="rg">Tipp</div><div class="rp">Punkte</div><div class="rt">Gesamt</div></div>
          ${rows || '<p class="hint">Niemand hat getippt.</p>'}
        </div>
        ${R.f ? `<div class="fact">💡 ${esc(R.f)}</div>` : ''}
        <div class="reveal-foot" id="revealFoot"></div>
      </section>`;
    if (isCmp) {
      countUp($('#abig'), 1, R.a, v => fmtRatio(v), fmtRatio(R.a, 4));
      revealStage(R);
    } else countUp($('#abig'), q.lo, R.a, v => fmt(v, 3), fmt(R.a, 5));
    renderRevealFooter();
  }

  function renderRevealFooter() {
    const f = $('#revealFoot'); if (!f) return;
    const last = S.round >= S.total;
    f.innerHTML = isHost()
      ? `<button class="btn primary big" id="nextBtn">${last ? 'Zum Endergebnis 🏆' : 'Nächste Frage ▶'}</button><span class="hint">automatisch in <b id="autoNext"></b> s</span>`
      : `<span class="hint">${last ? 'Endergebnis' : 'Nächste Frage'} in <b id="autoNext"></b> s</span>`;
    if (isHost()) $('#nextBtn').onclick = advance;
  }

  function revealStage(R) {
    const st = $('#stage'); if (!st) return;
    const unit = layoutStage(R.a);
    const top = st.clientHeight - 18 - 22;
    const lines = R.res.filter(r => r.v != null).map(r => ({ r, h: unit * r.v })).sort((a, b) => a.h - b.h);
    let lastH = -99, shift = 0;
    $('#glines').innerHTML = lines.map(({ r, h }, i) => {
      const p = pById(r.pid); if (!p) return '';
      const over = h > top; const y = Math.min(h, top);
      shift = Math.abs(y - lastH) < 26 ? shift + 34 : 0; lastH = y;
      return `<div class="gline ${over ? 'over' : ''}" style="bottom:${y + 18}px;--pc:${p.color};animation-delay:${0.4 + i * 0.12}s"><span style="right:${shift}px">${p.avatar}${over ? '<i>↑</i>' : ''}</span></div>`;
    }).join('');
  }

  function countUp(el, from, to, f, last) {
    const t0 = performance.now(); const d = 1100;
    const a = Math.log(Math.max(from, to / 1e4)); const b = Math.log(to);
    const step = t => {
      const k = Math.min(1, (t - t0) / d); const e = 1 - Math.pow(1 - k, 3);
      el.textContent = k < 1 ? f(Math.exp(a + (b - a) * e)) : last;
      if (k < 1) requestAnimationFrame(step); else el.classList.add('done');
    };
    requestAnimationFrame(step);
  }

  // ---------- Endergebnis ----------
  function renderFinal(fresh) {
    if (!fresh) return;
    const ranked = S.players.slice().sort((a, b) => b.score - a.score);
    const rank = p => ranked.findIndex(x => x.score === p.score) + 1;
    const pod = [ranked[1], ranked[0], ranked[2]];
    const podium = pod.map((p, i) => p ? `
      <div class="pod p${[2, 1, 3][i]}" style="--pc:${p.color}">
        <div class="pav">${p.avatar}</div>
        <div class="pname">${esc(p.name)}</div>
        <div class="pscore">${p.score}</div>
        <div class="block">${rank(p)}</div>
      </div>` : '<div class="pod empty"></div>').join('');
    const F = S.final || {};
    const award = (icon, title, info, text) => info && pById(info.pid) ? `<div class="award"><div class="aicon">${icon}</div><div><div class="atitle">${title}</div><div><b>${esc(pById(info.pid).name)}</b> ${text}</div></div></div>` : '';
    const mostWins = S.players.slice().sort((a, b) => b.wins - a.wins)[0];
    const awards = [
      award('🎯', 'Scharfschütze', F.best, F.best ? (Math.abs(F.best.v / F.best.a - 1) < 0.005 ? `traf bei ${F.best.e} ${esc(F.best.q)} exakt ins Schwarze` : `lag bei ${F.best.e} ${esc(F.best.q)} nur ${offText(F.best.v, F.best.a)} daneben`) : ''),
      award('🤡', 'Größter Fehlschuss', F.worst, F.worst ? `tippte bei ${F.worst.e} ${esc(F.worst.q)} ${esc(F.worst.gs)} statt ${esc(F.worst.as)}` : ''),
      mostWins && mostWins.wins ? award('👑', 'Rundenkönig', { pid: mostWins.pid }, `gewann ${mostWins.wins} ${mostWins.wins === 1 ? 'Runde' : 'Runden'}`) : '',
    ].join('');
    app().innerHTML = `
      <section class="screen final">
        <h1 class="final-title">🏆 ${esc(ranked[0]?.name || '')} gewinnt!</h1>
        <div class="podium">${podium}</div>
        <div class="final-grid">
          <div class="card">
            <h3>Endstand</h3>
            ${ranked.map(p => `<div class="frow ${p.pid === me.pid ? 'me' : ''}" style="--pc:${p.color}"><span class="rk">${rank(p)}.</span><span>${p.avatar}</span><b>${esc(p.name)}</b><span class="fx">🎯${p.hits} 👑${p.wins}</span><span class="fs">${p.score}</span></div>`).join('')}
          </div>
          <div class="card"><h3>Auszeichnungen</h3>${awards || '<p class="hint">Keine Tipps abgegeben.</p>'}</div>
        </div>
        <div class="lobby-cta">
          ${isHost() ? '<button class="btn primary huge" id="againBtn">Nochmal spielen ↻</button>' : '<div class="waiting">Warte auf den Host für eine Revanche …</div>'}
        </div>
      </section>`;
    if (isHost()) $('#againBtn').onclick = toLobby;
    confetti();
  }

  // ---------- Reaktionen ----------
  function showReaction(pid, e) {
    if (!S) return;
    const p = pById(pid);
    const el = document.createElement('div');
    el.className = 'floater';
    el.style.left = (8 + Math.random() * 84) + '%';
    el.innerHTML = `<b>${esc(e)}</b><small style="background:${p?.color || '#555'}">${esc(p?.name || '')}</small>`;
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 2600);
  }

  // ---------- UI-Helfer ----------
  function toast(html) {
    const t = document.createElement('div');
    t.className = 'toast'; t.innerHTML = html;
    $('#toasts').appendChild(t);
    setTimeout(() => t.classList.add('out'), 2600);
    setTimeout(() => t.remove(), 3100);
  }
  function busy(text) { $('#busy').hidden = false; $('#busyText').textContent = text; }
  function unbusy() { $('#busy').hidden = true; }
  function overlay(title, text, buttons) {
    unbusy();
    const o = $('#overlay');
    o.innerHTML = `<div class="modal card"><h3>${esc(title)}</h3><p>${esc(text)}</p><div class="mbtns">${buttons.map((b, i) => `<button class="btn ${b.primary ? 'primary' : ''}" data-i="${i}">${esc(b.t)}</button>`).join('')}</div></div>`;
    o.hidden = false;
    $$('[data-i]', o).forEach(btn => btn.onclick = () => { closeOverlay(); const b = buttons[+btn.dataset.i]; if (b.fn) b.fn(); });
  }
  function closeOverlay() { $('#overlay').hidden = true; }
  function shake(el) { if (!el) return; el.classList.remove('shake'); void el.offsetWidth; el.classList.add('shake'); }
  function errDetail(e) { return e && e.type ? ` (${e.type})` : ''; }
  function copy(text, msg) {
    const done = () => toast('✅ ' + msg);
    if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(text).then(done, () => fallbackCopy(text, done));
    else fallbackCopy(text, done);
  }
  function fallbackCopy(text, done) {
    const ta = document.createElement('textarea'); ta.value = text; document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); done(); } catch { prompt('Kopieren:', text); }
    ta.remove();
  }

  function confetti() {
    const c = $('#confetti'); const ctx = c.getContext('2d');
    c.width = innerWidth; c.height = innerHeight; c.hidden = false;
    const parts = Array.from({ length: 180 }, () => ({
      x: Math.random() * c.width, y: -20 - Math.random() * c.height * 0.6, r: 4 + Math.random() * 6,
      vx: -1.5 + Math.random() * 3, vy: 2 + Math.random() * 3.5, a: Math.random() * 6, va: -0.2 + Math.random() * 0.4,
      col: COLORS[Math.floor(Math.random() * COLORS.length)],
    }));
    const t0 = performance.now();
    const frame = t => {
      ctx.clearRect(0, 0, c.width, c.height);
      for (const p of parts) {
        p.x += p.vx; p.y += p.vy; p.a += p.va;
        ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.a); ctx.fillStyle = p.col; ctx.fillRect(-p.r / 2, -p.r / 4, p.r, p.r / 2); ctx.restore();
      }
      if (t - t0 < 5000) requestAnimationFrame(frame); else { ctx.clearRect(0, 0, c.width, c.height); c.hidden = true; }
    };
    requestAnimationFrame(frame);
  }

  // ---------- Init ----------
  function init() {
    $('#reactbar').innerHTML = REACTIONS.map(e => `<button data-r="${e}">${e}</button>`).join('');
    let lastR = 0;
    $$('#reactbar [data-r]').forEach(b => b.onclick = () => {
      const now = Date.now(); if (now - lastR < 500) return; lastR = now;
      send({ t: 'react', e: b.dataset.r });
    });
    $('#muteBtn').onclick = () => { Sound.muted = !Sound.muted; store.set('muted', Sound.muted); updateHeader(); };
    $('#leaveBtn').onclick = () => leave(false);
    $('#roomChip').onclick = () => S && copy(inviteLink() || S.code, inviteLink() ? 'Einladungslink kopiert' : 'Code kopiert');
    $('#logo').onclick = () => { if (!S) { mounted = ''; render(); } };
    window.addEventListener('resize', () => {
      if (!S || !S.q || S.q.type !== 'cmp') return;
      if (S.phase === 'question') layoutStage(G.cur); else if (S.phase === 'reveal') revealStage(S.reveal);
    });
    document.addEventListener('keydown', e => {
      if (S && S.phase === 'question' && S.q?.type === 'cmp' && document.activeElement?.id !== 'numIn') {
        if (e.key === '+' || e.key === '=') nudge(15);
        if (e.key === '-') nudge(-15);
      }
      if (e.key === 'Enter' && S && S.phase === 'question' && document.activeElement?.id !== 'numIn') lockIn();
    });
    window.addEventListener('beforeunload', e => {
      if (role === 'host' && S && S.players.length > 1) { e.preventDefault(); e.returnValue = ''; }
    });
    window.addEventListener('pagehide', () => { if (role === 'host') broadcast({ t: 'bye' }); });
    if (typeof window.Peer !== 'function') {
      overlay('Fehler', 'Die Netzwerkbibliothek konnte nicht geladen werden.', [{ t: 'OK', primary: true }]);
    }
    render();
  }

  // Für automatisierte Tests
  window.__sizeclash = { get state() { return S; }, get host() { return H; }, me };

  init();
})();

</script>
